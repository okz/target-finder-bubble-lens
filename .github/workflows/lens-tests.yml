name: Lens tests

on:
  push:
    branches: [main, feature/ambiguity-gaze-lens]
  pull_request:

jobs:
  deterministic-lens:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install --yes libegl1 libxkbcommon-x11-0
          python -m pip install --editable . --no-deps
          python -m pip install numpy PyQt6 pytest pytest-qt pillow
      - name: Unit and offscreen render tests
        run: python -m pytest -q
      - name: Replay report and contact sheet
        run: >-
          python tools/replay_lens.py
          --scenarios tests/fixtures/lens
          --report artifacts/replay-report.json
          --contact-sheet artifacts/contact-sheet.png
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: lens-test-artifacts
          path: artifacts/
          if-no-files-found: ignore
