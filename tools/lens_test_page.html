<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bubble Gaze Lens test page</title>
  <style>
    :root { font-family: system-ui, sans-serif; color: #172033; background: #f4f6fa; }
    body { margin: 0; padding: 48px; }
    h1 { margin-top: 0; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; }
    .card { min-height: 230px; padding: 28px; border-radius: 18px; background: white; box-shadow: 0 8px 28px #21304d18; }
    .dense { display: flex; gap: 6px; align-items: center; margin-top: 70px; }
    .dense button { width: 34px; height: 34px; padding: 0; border: 1px solid #8791a8; border-radius: 7px; background: #edf2ff; }
    .isolated { display: grid; place-items: center; height: 170px; }
    .isolated button { min-width: 150px; min-height: 52px; border: 0; border-radius: 10px; color: white; background: #3157d5; }
    .note { color: #66718a; }
  </style>
</head>
<body>
  <h1>Bubble Gaze Lens dry-run test</h1>
  <p class="note">Hold the mouse between adjacent controls. The lens should open only in the dense card.</p>
  <main class="grid">
    <section class="card">
      <h2>Dense controls</h2>
      <div class="dense" aria-label="Dense controls">
        <button title="Previous">◀</button>
        <button title="Play">▶</button>
        <button title="Next">▶|</button>
        <button title="More">•••</button>
      </div>
    </section>
    <section class="card">
      <h2>Isolated control</h2>
      <div class="isolated"><button>Single target</button></div>
    </section>
  </main>
</body>
</html>
